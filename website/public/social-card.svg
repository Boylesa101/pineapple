<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title>Pineapple social card</title>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf6ff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7ebff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#5aa1ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect x="72" y="72" width="1056" height="486" rx="40" fill="#ffffff" opacity="0.88"/>
  <rect x="96" y="116" width="520" height="350" rx="36" fill="url(#card)"/>
  <text x="136" y="212" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="700">Pineapple</text>
  <text x="136" y="278" fill="#eaf4ff" font-family="Inter, Arial, sans-serif" font-size="34">Your travel essentials in one secure place — even offline.</text>
  <text x="136" y="348" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26">Travel docs</text>
  <text x="136" y="390" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26">Trips + reminders</text>
  <text x="136" y="432" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26">SOS access</text>
  <rect x="680" y="146" width="344" height="92" rx="28" fill="#f3f9ff" stroke="#d5e9ff"/>
  <rect x="680" y="258" width="344" height="92" rx="28" fill="#f3f9ff" stroke="#d5e9ff"/>
  <rect x="680" y="370" width="344" height="92" rx="28" fill="#f3f9ff" stroke="#d5e9ff"/>
  <text x="718" y="202" fill="#16324f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Local-first privacy</text>
  <text x="718" y="314" fill="#16324f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Offline-ready access</text>
  <text x="718" y="426" fill="#16324f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Travel clarity, not clutter</text>
</svg>
